# Supabase project configuration.
# `project_id` is a local label; the remote project is chosen by
# `npx supabase link --project-ref <your-project-ref>`.
project_id = "love21-foundation"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
# Email confirmation is REQUIRED: users must click the link before logging in.
enable_confirmations = true
double_confirm_changes = true
